name: Generate contribution snake

# La serpiente verde hecha con cubitos: Platane/snk lee el calendario real
# de contribuciones de ChenteJD, genera un juego de la serpiente que se come
# los cubitos, y exporta un SVG animado. No es una imagen simulada.
# Fuente: https://github.com/Platane/snk

on:
  schedule:
    # Cada día a las 04:20 UTC (22:20 en Ciudad de México, fuera de la hora en punto para evitar retrasos)
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=A4FF03&color_dots=153964,0d2137,1e6f5c,76D8FF,A4FF03
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=A4FF03&color_dots=153964,0d2137,1e6f5c,76D8FF,A4FF03
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
